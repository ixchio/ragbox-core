[project]
name = "ragbox-core"
version = "3.0.0"
description = "RAG in 3 lines. Real GraphRAG with entity traversal, multi-hop decomposition, cross-encoder reranking, and streaming. No LangChain required."
authors = [{ name = "Developer", email = "amankumarpandeyin@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
keywords = ["rag", "llm", "ai", "vector-search", "knowledge-graph", "graphrag", "langchain-alternative", "llamaindex-alternative", "retrieval-augmented-generation", "minimal-rag"]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "aiofiles>=23.0,<24.0",
    "watchdog>=3.0,<4.0",
    "chromadb>=1.5.9,<2.0.0",
    "networkx>=3.0,<4.0",
    "fastembed>=0.9.0,<0.10.0",
    "numpy>=1.26,<2.0; python_version < '3.13'",
    "numpy>=2.1,<3.0; python_version >= '3.13'",
    "scipy>=1.11,<2.0",
    "loguru>=0.7,<0.8",
    "typer>=0.9,<0.10",
    "rich>=13.0,<14.0",
    "python-dotenv",
    "tenacity",
    "tiktoken",
    "pypdf",
    "pdfplumber",
    "python-pptx",
    "leidenalg",
    "python-louvain",
    "igraph",
    "openai",
    "anthropic",
    "groq",
]

[project.optional-dependencies]
ocr = ["paddleocr"]
local = ["llama-cpp-python"]
code = ["tree-sitter", "tree-sitter-python"]
server = ["fastapi", "uvicorn"]
neo4j = ["neo4j>=5.0,<6.0"]
advanced = ["scikit-learn>=1.3,<2.0", "camelot-py", "python-magic"]
all = ["paddleocr", "llama-cpp-python", "tree-sitter", "tree-sitter-python", "camelot-py", "python-magic", "neo4j>=5.0,<6.0", "scikit-learn>=1.3,<2.0", "fastapi", "uvicorn"]

[project.scripts]
ragbox = "ragbox.cli:app"
ragbox-mcp = "ragbox.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ixchio/ragbox-core"
Documentation = "https://ixchio.github.io/ragbox-core/"
Repository = "https://github.com/ixchio/ragbox-core"
Issues = "https://github.com/ixchio/ragbox-core/issues"

[tool.poetry]
packages = [{ include = "ragbox" }]
exclude = ["tests/", "docs/", "benchmarks/", ".env", "*.db", "chroma_db/", "knowledge_graph/", "logs/"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
mypy = "^1.5.0"
black = "^23.7.0"
ruff = ">=0.15.11,<0.16.0"

[tool.poetry.group.benchmark]
optional = true

[tool.poetry.group.benchmark.dependencies]
ragas = "*"
datasets = "*"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "community",
    "fastapi",
    "fastapi.*",
    "igraph",
    "leidenalg",
    "llama_cpp",
    "networkx",
    "paddleocr",
    "pinecone",
    "pinecone.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
